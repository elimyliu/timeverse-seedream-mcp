[project]
name = "timeverse-seedream-mcp"
version = "0.1.0"
description = "Seedream 图片生成 MCP Server - 基于火山引擎 Seedream 模型的图像生成工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT © TimeVerse Studio" }
authors = [
    { name = "TimeVerse Studio" },
]
keywords = ["mcp", "seedream", "image-generation", "volcengine", "ai"]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
timeverse-seedream-mcp = "timeverse_seedream_mcp.__main__:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
